[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "repsteer"
version = "0.1.0"
description = "Representation engineering and activation steering toolkit for large language models"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
classifiers = [
  "License :: OSI Approved :: Apache Software License",
]

[tool.setuptools.packages.find]
where = ["src"]
