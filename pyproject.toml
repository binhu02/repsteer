[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "repsteer"
description = "Representation engineering and activation steering toolkit for large language models"
version = "0.2.0"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "transformers>=5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
    "gpu: tests that require a CUDA-capable GPU",
]
